<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>You're offline · ClientFlow</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef1fb;
        --card: #ffffff;
        --text: #1a1d33;
        --muted: #4b5068;
        --brand: #4a4fc9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0c;
          --card: #18181a;
          --text: #f2f2f3;
          --muted: #b4b4b8;
          --brand: #c3c6ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 26rem;
        width: 100%;
        background: var(--card);
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 12px 40px -20px rgb(20 20 60 / 35%);
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 1.4rem;
        line-height: 1.3;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        padding: 10px 20px;
        font: inherit;
        font-weight: 600;
        color: var(--card);
        background: var(--brand);
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--brand);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        ClientFlow needs the internet to show your clients and work. Nothing you saved is lost: try
        again once you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
